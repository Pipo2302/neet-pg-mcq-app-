workflows:
  build-android:
    name: Build NEET-PG Android
    environment:
      flutter: stable
    scripts:
      - name: Extract Flutter project
        script: |
          unzip -o neet_pg_mcq_payload.zip
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
